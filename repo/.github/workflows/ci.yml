# UNTESTED on GitHub Actions (written but never run). Mirrors the local command that passed: `pytest -q tests`.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install torch qwen-tts==0.1.1 safetensors pytest
      - run: pip install -e . --no-deps
      - run: pytest -q tests
